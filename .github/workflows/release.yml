name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build TikTok sidecar
        working-directory: sidecar/tiktok
        run: |
          go mod tidy
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-s -w" -o ../../bin/geseki-bridge-tiktok.exe .
          Get-Item ../../bin/geseki-bridge-tiktok.exe | Format-List Name, Length

      - name: Test vendored TikTok patches
        # Regression guard for our local gotiktoklive patches (avatar, badge,
        # gift image). It is a nested module, so run tests from inside it.
        working-directory: sidecar/tiktok/third_party/gotiktoklive
        run: go test ./... -v

      - name: Configure plugin
        # The CMake project fetches the OBS sources + prebuilt deps declared in
        # buildspec.json on first configure, so this step is slow but self-contained.
        run: cmake --preset windows-x64

      - name: Build plugin
        run: cmake --build --preset windows-x64 --config RelWithDebInfo --parallel

      - name: Install plugin
        run: cmake --install build_x64 --prefix "${{ github.workspace }}/release" --config RelWithDebInfo

      - name: Place sidecar next to the plugin DLL
        run: |
          $dest = "release/geseki-bridge/bin/64bit"
          Copy-Item "bin/geseki-bridge-tiktok.exe" $dest -Force
          Get-ChildItem -Recurse release | Select-Object FullName

      - name: Package
        run: |
          $version = (Get-Content buildspec.json -Raw | ConvertFrom-Json).version
          $name = "geseki-bridge-$version-windows-x64"
          Compress-Archive -Path "release/geseki-bridge" -DestinationPath "$name.zip" -Force
          echo "ASSET=$name.zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geseki-bridge-windows-x64
          path: ${{ env.ASSET }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
