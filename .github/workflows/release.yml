name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build TikTok sidecar
        working-directory: sidecar/tiktok
        run: |
          go mod tidy
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-s -w" -o ../../bin/geseki-bridge-tiktok.exe .
          Get-Item ../../bin/geseki-bridge-tiktok.exe | Format-List Name, Length

      - name: Test vendored TikTok patches
        # Regression guard for our local gotiktoklive patches (avatar, badge,
        # gift image, emote). It is a nested module, so run tests from inside it.
        working-directory: sidecar/tiktok/third_party/gotiktoklive
        run: go test ./... -v

      - name: Test sidecar
        # The sidecar's own tests (e.g. the standalone-emote-to-chat reshape).
        working-directory: sidecar/tiktok
        run: go test . -v

      - name: Configure plugin
        # The CMake project fetches the OBS sources + prebuilt deps declared in
        # buildspec.json on first configure, so this step is slow but self-contained.
        run: cmake --preset windows-x64

      - name: Build plugin
        run: cmake --build --preset windows-x64 --config RelWithDebInfo --parallel

      - name: Install plugin
        run: cmake --install build_x64 --prefix "${{ github.workspace }}/release" --config RelWithDebInfo

      - name: Place sidecar next to the plugin DLL
        run: |
          $dest = "release/obs-plugins/64bit"
          Copy-Item "bin/geseki-bridge-tiktok.exe" $dest -Force
          Get-ChildItem -Recurse release | Select-Object FullName

      - name: Place the local sign server next to the plugin DLL
        run: |
          # The local sign server (Node) signs TikTok on this machine, with no
          # third-party service. Ship the sources only: node_modules (~55 MB)
          # is installed on first run by the plugin, and Chrome is taken from
          # the user's machine.
          $dest = "release/obs-plugins/64bit/sign-server"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "sign-server/server.mjs" $dest -Force
          Copy-Item "sign-server/xgnarly.mjs" $dest -Force
          Copy-Item "sign-server/package.json" $dest -Force
          Copy-Item "sign-server/package-lock.json" $dest -Force
          Copy-Item "sign-server/README.md" $dest -Force
          Copy-Item "sign-server/javascript" $dest -Recurse -Force
          Get-ChildItem -Recurse $dest | Select-Object FullName

      - name: Package
        run: |
          $version = (Get-Content buildspec.json -Raw | ConvertFrom-Json).version
          $name = "geseki-bridge-$version-windows-x64"
          # Flat OBS tree (obs-plugins/64bit + data/obs-plugins/...) so the zip
          # can be extracted straight into an OBS install folder -- portable or
          # installer. A named bundle would only work for installer OBS via
          # %ProgramData%\obs-studio\plugins, which portable OBS ignores.
          Compress-Archive -Path "release/obs-plugins", "release/data" -DestinationPath "$name.zip" -Force
          echo "ASSET=$name.zip" >> $env:GITHUB_ENV

      - name: Build installer
        run: |
          # Mirror obs-advanced-masks: ship a friendly one-click .exe alongside
          # the manual zip. Inno Setup is fetched from its official GitHub
          # releases mirror and installed silently, then ISCC compiles the
          # script with the same flat tree the zip uses.
          $version = (Get-Content buildspec.json -Raw | ConvertFrom-Json).version
          curl.exe -sL -o innosetup.exe "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          Start-Process -FilePath ".\innosetup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/CURRENTUSER" -Wait
          New-Item -ItemType Directory -Force -Path "package" | Out-Null
          Copy-Item "release/obs-plugins" "package/obs-plugins" -Recurse -Force
          Copy-Item "release/data" "package/data" -Recurse -Force
          $env:GESEKI_VERSION = $version
          # Inno Setup 6 installs per-user under LOCALAPPDATA with /CURRENTUSER;
          # fall back to the machine-wide path if a runner image differs.
          $iscc = Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after installing Inno Setup" }
          & $iscc /Qp installer.iss
          if (-not (Test-Path "package/geseki-bridge-$version-windows-installer.exe")) {
            throw "Installer compile failed"
          }
          $installer = "geseki-bridge-$version-windows-installer"
          Compress-Archive -Path "package/geseki-bridge-$version-windows-installer.exe" -DestinationPath "$installer.zip" -Force
          echo "INSTALLER=$installer.zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geseki-bridge-windows-x64
          path: |
            ${{ env.ASSET }}
            ${{ env.INSTALLER }}

      - name: Detect prerelease
        run: |
          # Follows the obs-advanced-masks convention: a plain vX.Y.Z tag is a
          # stable release; anything else (e.g. v0.1.1a, v0.2.0-alpha.1) is a
          # prerelease. The action's `prerelease` input defaults to false, so
          # this must be set explicitly.
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          $isPre = $tag -notmatch '^v\d+\.\d+\.\d+$'
          $label = if ($isPre) { "Pre-Release" } else { "Release" }
          echo "PRERELEASE=$($isPre.ToString().ToLower())" >> $env:GITHUB_ENV
          echo "REL_NAME=$label $ver" >> $env:GITHUB_ENV

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.REL_NAME }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          files: |
            ${{ env.ASSET }}
            ${{ env.INSTALLER }}
          generate_release_notes: true
